
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Report - SafeSpeak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">🛡 SafeSpeak</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="report.html">Report</a>
        <a href="track.html">Track</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
    <button class="exit-btn" onclick="quickExit()">Quick Exit</button>
</header>

<section class="report-page">
    <h1>Track Your Complaint</h1>
    <p>Enter your Case ID to check your saved report.</p>

    <label for="caseInput">Case ID</label>
    <input
        type="text"
        id="caseInput"
        placeholder="Example: SS-123456"
        maxlength="9"
    >

    <button class="btn" onclick="trackReport()">Track Report</button>

    <div id="statusBox" class="summary-box" style="display:none;">
        <h3>Complaint Status</h3>
        <p id="statusText"></p>
    </div>
</section>

<script src="script.js"></script>
</body>
</html>
