
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSpeak Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">🛡 SafeSpeak</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="report.html">Report</a>
        <a href="track.html">Track</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
    <button class="exit-btn" onclick="quickExit()">Quick Exit</button>
</header>

<section class="report-page">
    <h1>Dashboard</h1>

    <div class="cards">
        <div class="card">
            <h2>Total Reports</h2>
            <h1 id="totalReports">0</h1>
        </div>

        <div class="card">
            <h2>Latest Case ID</h2>
            <h1 id="latestCase">No Report</h1>
        </div>

        <div class="card">
            <h2>Latest Category</h2>
            <p id="reportCategory">-</p>
        </div>

        <div class="card">
            <h2>Incident Date</h2>
            <p id="incidentDate">-</p>
        </div>

        <div class="card">
            <h2>Location</h2>
            <p id="incidentLocation">-</p>
        </div>
    </div>

    <h2 style="text-align:center; margin-top:40px; color:#0F766E;">
        Manage Reports
    </h2>

    <input
        type="search"
        id="reportSearch"
        placeholder="Search by Case ID, category or status"
        oninput="filterReports()"
        style="width:100%; margin-top:20px;"
    >

    <div id="reportList" class="cards"></div>

    <div style="text-align:center;">
        <a href="report.html" class="btn">Submit Another Report</a>
    </div>
</section>

<script src="script.js"></script>
</body>
</html>
