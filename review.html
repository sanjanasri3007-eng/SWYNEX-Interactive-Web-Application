
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Report</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<div class="logo">
🛡 SafeSpeak
</div>

<nav>
<a href="index.html">Home</a>
<a href="report.html">Report</a>
<a href="track.html">Track</a>
<a href="dashboard.html">Dashboard</a>
</nav>

<button class="exit-btn" onclick="quickExit()">
Quick Exit
</button>

</header>

<section class="report-page">

<div class="progress">
<span class="done">✔ Report</span>
<span class="current">● Review</span>
<span>○ Evidence</span>
<span>○ Complaint</span>
<span>○ Success</span>
</div>

<h1>Review Your Report</h1>

<p>Please review your information before generating your complaint.</p>

<div class="notice">

<h3>Report Summary</h3>

<p>Case ID: <strong id="reviewCaseID"></strong></p>

<p>Incident Category:
<strong id="reviewCategory"></strong>
</p>

<p>Date:
<strong id="reviewDate"></strong>
</p>

<p>Location:
<strong id="reviewLocation"></strong>
</p>

<p>Description:</p>

<div class="summary-box" id="reviewDescription"></div>

</div>

<br>

<a href="evidence.html" class="btn">
Continue to Evidence
</a>

</section>

<script src="script.js"></script>

<script>
document.getElementById("reviewCaseID").textContent =
localStorage.getItem("currentCaseID") || "Not Generated";

document.getElementById("reviewCategory").textContent =
localStorage.getItem("category") || "Not Provided";

document.getElementById("reviewDate").textContent =
localStorage.getItem("date") || "Not Provided";

document.getElementById("reviewLocation").textContent =
localStorage.getItem("location") || "Not Provided";

document.getElementById("reviewDescription").textContent =
localStorage.getItem("description") || "No Description";
</script>

</body>
</html>
